<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de contraseñas seguras</title>
<meta name="description" content="Genera contraseñas seguras en tu navegador con el generador criptográfico del sistema. Nada sale de tu equipo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='12' y='28' width='40' height='30' rx='6' fill='%2322c55e'/%3E%3Cpath d='M20 28v-8a12 12 0 0 1 24 0v8' stroke='%2322c55e' stroke-width='6' fill='none'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0b0f14; --card:#121821; --line:#1f2a36; --tx:#d7e0ea; --tx2:#8796a8; --acc:#22c55e; --warn:#eab308; --bad:#ef4444; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f7fa; --card:#fff; --line:#dfe5ec; --tx:#18212b; --tx2:#5b6b7d; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--tx); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  main { width:100%; max-width:560px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--tx2); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .out { display:flex; gap:8px; }
  .pw { flex:1; min-width:0; font:600 20px/1.3 ui-monospace,Consolas,monospace; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:14px; color:var(--tx); word-break:break-all; user-select:all; }
  button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--tx); padding:0 14px; cursor:pointer; }
  button.p { background:var(--acc); border-color:var(--acc); color:#04210f; font-weight:700; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .meter { height:8px; border-radius:4px; background:var(--line); margin:14px 0 6px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; transition:width .25s, background .25s; }
  .info { display:flex; justify-content:space-between; color:var(--tx2); font-size:14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
  input[type=range] { flex:1; accent-color:var(--acc); }
  label.chk { display:flex; align-items:center; gap:10px; margin-top:12px; cursor:pointer; }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--acc); }
  .actions { display:flex; gap:8px; margin-top:20px; }
  .actions button { padding:12px 16px; flex:1; }
  footer { color:var(--tx2); font-size:13px; margin-top:16px; text-align:center; }
  footer a { color:var(--acc); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); background:var(--acc); color:#04210f; font-weight:700; padding:10px 16px; border-radius:10px; transition:transform .2s; }
  .toast.on { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main>
  <h1>🔐 Generador de contraseñas</h1>
  <p class="sub">Usa el generador criptográfico de tu navegador. Nada sale de tu equipo.</p>
  <div class="card">
    <div class="out">
      <div class="pw" id="pw" aria-live="polite"></div>
      <button id="copy" title="Copiar" aria-label="Copiar contraseña">📋</button>
    </div>
    <div class="meter"><i id="bar"></i></div>
    <div class="info"><span id="level"></span><span id="bits"></span></div>

    <div class="row">
      <label for="len">Longitud: <b id="lenv">16</b></label>
      <input type="range" id="len" min="4" max="64" value="16">
    </div>
    <label class="chk"><input type="checkbox" id="num" checked> Incluir números (0-9)</label>
    <label class="chk"><input type="checkbox" id="sym" checked> Incluir símbolos (!@#$…)</label>

    <div class="actions">
      <button class="p" id="gen">Generar otra</button>
    </div>
  </div>
  <footer>
    Misma lógica que la herramienta de terminal: al menos un carácter de cada grupo y mezcla de Fisher-Yates.
    <br><a href="https://github.com/virtuanista/password-generator">Código en GitHub</a> · MIT
  </footer>
</main>
<div class="toast" id="toast">Copiada ✔</div>
<script>
// Español por defecto; ?lang=en muestra la página en inglés.
const EN = {
 "Generador de contraseñas seguras": "Secure password generator",
 "🔐 Generador de contraseñas": "🔐 Password generator",
 "Usa el generador criptográfico de tu navegador. Nada sale de tu equipo.": "Uses your browser’s cryptographic generator. Nothing leaves your computer.",
 "Copiar": "Copy",
 "Copiar contraseña": "Copy password",
 "Longitud:": "Length:",
 "Incluir números (0-9)": "Include numbers (0-9)",
 "Incluir símbolos (!@#$…)": "Include symbols (!@#$…)",
 "Generar otra": "Generate another",
 "Misma lógica que la herramienta de terminal: al menos un carácter de cada grupo y mezcla de Fisher-Yates.": "Same logic as the terminal tool: at least one character from each group and a Fisher-Yates shuffle.",
 "Código en GitHub": "Code on GitHub",
 "Copiada ✔": "Copied ✔",
 "Muy fuerte": "Very strong",
 "Fuerte": "Strong",
 "Aceptable": "Fair",
 "Débil": "Weak",
 "bits de entropía": "bits of entropy"
};
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es', tr = s => LANG === 'en' ? EN[s] ?? s : s;
if (LANG === 'en') {
  document.documentElement.lang = 'en'; document.title = tr(document.title);
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; n = w.nextNode();) { const k = n.data.replace(/\s+/g, ' ').trim(); if (EN[k]) n.data = n.data.replace(/^(\s*)[\s\S]*?(\s*)$/, (_, a, b) => a + EN[k] + b); }
  for (const el of document.querySelectorAll('[aria-label],[title],[alt],[placeholder]')) for (const a of ['aria-label', 'title', 'alt', 'placeholder']) if (EN[el.getAttribute(a)]) el.setAttribute(a, EN[el.getAttribute(a)]);
}
{ const b = document.createElement('p'); b.style.cssText = 'position:absolute;top:12px;right:16px;margin:0;font-size:14px';
  b.innerHTML = LANG === 'en' ? '<a href="?lang=es" lang="es">Español</a> · <b>English</b>' : '<b>Español</b> · <a href="?lang=en" lang="en">English</a>';
  b.querySelector('a').style.color = 'inherit'; (document.querySelector('[data-lang]') ?? document.body).append(b);
  b.querySelector('a').addEventListener('click', e => { e.currentTarget.href = e.currentTarget.getAttribute('href').split('#')[0] + location.hash; }); }
</script>
<script>
  const LETTERS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const NUMBERS = '0123456789';
  const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';
  const $ = (id) => document.getElementById(id);

  // Entero uniforme en [0, max) sin sesgo de módulo (muestreo por rechazo).
  function randomInt(max) {
    const limit = Math.floor(0x100000000 / max) * max;
    const buf = new Uint32Array(1);
    do crypto.getRandomValues(buf); while (buf[0] >= limit);
    return buf[0] % max;
  }

  function generate(length, useNumbers, useSymbols) {
    const groups = [LETTERS];
    if (useNumbers) groups.push(NUMBERS);
    if (useSymbols) groups.push(SYMBOLS);
    const all = groups.join('');
    const chars = groups.map((g) => g[randomInt(g.length)]);
    while (chars.length < length) chars.push(all[randomInt(all.length)]);
    for (let i = chars.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
  }

  function entropy(length, useNumbers, useSymbols) {
    const size = LETTERS.length + (useNumbers ? NUMBERS.length : 0) + (useSymbols ? SYMBOLS.length : 0);
    return Math.round(length * Math.log2(size));
  }

  function render() {
    const len = +$('len').value, n = $('num').checked, s = $('sym').checked;
    $('lenv').textContent = len;
    $('pw').textContent = generate(len, n, s);
    const bits = entropy(len, n, s);
    const [name, color] = bits >= 100 ? ['Muy fuerte', 'var(--acc)'] : bits >= 70 ? ['Fuerte', 'var(--acc)'] : bits >= 50 ? ['Aceptable', 'var(--warn)'] : ['Débil', 'var(--bad)'];
    $('level').textContent = tr(name);
    $('level').style.color = color;
    $('bits').textContent = `~${bits} ${tr('bits de entropía')}`;
    $('bar').style.width = Math.min(100, bits / 1.28) + '%';
    $('bar').style.background = color;
  }

  async function copy() {
    try { await navigator.clipboard.writeText($('pw').textContent); }
    catch { const r = document.createRange(); r.selectNodeContents($('pw')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
    $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1200);
  }

  ['len', 'num', 'sym'].forEach((id) => $(id).addEventListener('input', render));
  $('gen').addEventListener('click', render);
  $('copy').addEventListener('click', copy);
  render();
</script>
</body>
</html>
